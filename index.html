<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naam Jap Counter</title>
    <style>
        /* Peaceful Spiritual Theme Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            color: #431407;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(120, 53, 4, 0.15);
            border: 2px solid #fdba74;
            text-align: center;
            position: relative;
            box-sizing: border-box;
        }
        h1 {
            color: #9a3412;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }
        p {
            color: #7c2d12;
            font-size: 16px;
            margin-bottom: 30px;
        }
        /* Selection Buttons */
        .selection-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn-select {
            background: #fff7ed;
            color: #9a3412;
            border: 2px solid #ea580c;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-select:hover {
            background: #ea580c;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.2);
        }
        /* Counter Screen Layout */
        .selected-title {
            font-size: 32px;
            color: #ea580c;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .count-display {
            font-size: 72px;
            font-weight: bold;
            color: #431407;
            margin: 20px 0;
            font-family: monospace;
        }
        .btn-jap {
            background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
            color: white;
            border: none;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(234, 88, 12, 0.3);
            transition: all 0.1s ease;
            user-select: none;
        }
        .btn-jap:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(234, 88, 12, 0.2);
        }
        /* Corner Buttons */
        .btn-corner-left {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #64748b;
        }
        .btn-corner-right {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #fef2f2;
            border: 1px solid #fca5a5;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #dc2626;
        }
        .btn-corner-left:hover { background: #e2e8f0; }
        .btn-corner-right:hover { background: #fee2e2; }
        
        /* Stats Dashboard Section */
        .stats-box {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed #fed7aa;
            text-align: left;
        }
        .stats-title {
            font-size: 14px;
            font-weight: bold;
            color: #7c2d12;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            color: #431407;
            padding: 4px 0;
        }
    </style>
</head>
<body>

    <div id="selectionScreen" class="card">
        <h1>Naam Jap Counter</h1>
        <p>Kripya naam chuniye jiska aap jap karna chahte hain:</p>
        <div class="selection-box">
            <button onclick="startJap('Shri Ram')" class="btn-select">🏹 Shri Ram</button>
            <button onclick="startJap('Shri Radha')" class="btn-select">🪕 Shri Radha</button>
        </div>
        
        <div class="stats-box" style="margin-top: 35px;">
            <div class="stats-title">Aapka Kul Kul Jap (Saved)</div>
            <div class="stats-row"><span>Total Ram Jap:</span> <span id="homeRamCount" style="font-weight:bold;">0</span></div>
            <div class="stats-row"><span>Total Radha Jap:</span> <span id="homeRadhaCount" style="font-weight:bold;">0</span></div>
        </div>
    </div>

    <div id="counterScreen" class="card" style="display: none;">
        <button onclick="goBack()" class="btn-corner-left">← Change</button>
        <button onclick="resetCurrentCounter()" class="btn-corner-right">Reset 🔄</button>
        
        <div style="margin-top: 20px;">
            <div id="selectedNaamDisplay" class="selected-title">Naam</div>
            <div class="count-display" id="mainCounter">0</div>
            
            <button onclick="incrementCounter()" class="btn-jap" id="japActionBtn">JAP</button>
        </div>

        <div class="stats-box">
            <div class="stats-title">Live Saving Dashboard</div>
            <div class="stats-row"><span id="lblRam">Total Ram Jap:</span> <span id="statRamCount" style="font-weight:bold;">0</span></div>
            <div class="stats-row"><span id="lblRadha">Total Radha Jap:</span> <span id="statRadhaCount" style="font-weight:bold;">0</span></div>
        </div>
    </div>

    <script>
        // Core state tracker
        let activeNaam = "";
        
        // Load counts dynamically from browser localStorage on startup
        let ramTotalData = parseInt(localStorage.getItem('ramCounter')) || 0;
        let radhaTotalData = parseInt(localStorage.getItem('radhaCounter')) || 0;

        // Initialize display values immediately
        refreshUI();

        function startJap(naam) {
            activeNaam = naam;
            
            // Toggle screen screens smoothly
            document.getElementById("selectionScreen").style.display = "none";
            document.getElementById("counterScreen").style.display = "block";
            
            // Set contextual labels
            document.getElementById("selectedNaamDisplay").innerText = naam;
            document.getElementById("japActionBtn").innerText = naam === "Shri Ram" ? "RAM" : "RADHA";
            
            // Set current session view counter
            updateCounterDisplay();
        }

        function incrementCounter() {
            if (activeNaam === "Shri Ram") {
                ramTotalData++;
                localStorage.setItem('ramCounter', ramTotalData);
            } else if (activeNaam === "Shri Radha") {
                radhaTotalData++;
                localStorage.setItem('radhaCounter', radhaTotalData);
            }
            
            // Update counts instantly
            updateCounterDisplay();
            refreshUI();
        }

        function updateCounterDisplay() {
            // Show corresponding numeric data based on active selection
            if (activeNaam === "Shri Ram") {
                document.getElementById("mainCounter").innerText = ramTotalData;
            } else {
                document.getElementById("mainCounter").innerText = radhaTotalData;
            }
        }

        function resetCurrentCounter() {
            // Confirmation alert before clearing data
            let confirmClear = confirm("Kya aap " + activeNaam + " ka counter zero (0) karna chahte hain?");
            if (confirmClear) {
                if (activeNaam === "Shri Ram") {
                    ramTotalData = 0;
                    localStorage.setItem('ramCounter', 0);
                } else {
                    radhaTotalData = 0;
                    localStorage.setItem('radhaCounter', 0);
                }
                updateCounterDisplay();
                refreshUI();
            }
        }

        function refreshUI() {
            // Update display logs everywhere across screens
            document.getElementById("homeRamCount").innerText = ramTotalData;
            document.getElementById("homeRadhaCount").innerText = radhaTotalData;
            document.getElementById("statRamCount").innerText = ramTotalData;
            document.getElementById("statRadhaCount").innerText = radhaTotalData;
        }

        function goBack() {
            // Return to home selection interface cleanly
            document.getElementById("counterScreen").style.display = "none";
            document.getElementById("selectionScreen").style.display = "block";
        }
    </script>
</body>
</html>
